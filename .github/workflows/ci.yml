name: CI

on:
  push:
    # Nur Branch-Pushes. Ein Tag zeigt auf einen bereits geprueften Commit;
    # ohne diese Einschraenkung lief die CI pro Release ein zweites Mal.
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  build:
    name: Pruefen und Archive bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          # Node 22 oder neuer: Der CDP-Client nutzt das globale WebSocket,
          # das es erst ab Node 22 ohne Zusatzschalter gibt. Mit Node 20
          # scheiterte der Rauchtest mit "WebSocket is not defined".
          node-version: "22"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Umgebung anzeigen
        run: |
          node --version
          node -e "console.log('WebSocket:', typeof WebSocket)"
          python3 --version
          google-chrome --version || chromium --version || echo "kein Chrome gefunden"

      - name: Firefox-Variante pruefen (Parity)
        run: python3 tools/sync-firefox.py --check

      - name: Syntaxcheck und Regressionstest
        run: npm test

      - name: Rauchtest im Browser (Fixtures)
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run browser:smoke
          else
            echo "Kein Chrome/Chromium vorhanden - Rauchtest uebersprungen."
          fi

      - name: Klick-Tests im Browser (nur lesend)
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1; then
            npm run browser:clicks
          else
            echo "Kein Chrome/Chromium vorhanden - Klick-Tests uebersprungen."
          fi

      - name: Rauchtest-Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: znuny-helper-rauchtest
          if-no-files-found: ignore
          path: tools/browser/output/

      - name: Release-Archive bauen
        run: python3 tools/build-release-zips.py

      - name: Release-Archive pruefen
        run: python3 tools/verify-release-zips.py

      - name: Archive als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: znuny-helper-release-archive
          if-no-files-found: error
          path: |
            znuny-helper-extension.zip
            znuny-helper-extension-firefox.zip
            znuny-helper-extension-firefox.xpi
